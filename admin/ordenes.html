<!DOCTYPE html>
<!--
  Archivo: admin/ordenes.html
  Qué es: listado de órdenes de compra del panel de administración, en una
          tabla con paginación. Muestra primero las más recientes.
  Quién puede verla: Administrador y Vendedor.
  Script propio: js/admin/ordenes.js
  Rutas: esta página está dentro de la carpeta admin/. Para llegar a los
          archivos de la raíz (css, js, assets) las rutas empiezan con "../".
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho de la pantalla del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes | Panel AndesTrekking</title>

  <!-- Ícono de la pestaña del navegador (favicon) -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo/favicon.svg">

  <!-- Estilos, en este orden: Bootstrap, íconos, los comunes del sitio
       y al final los propios del panel -->
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- El panel parte oculto (atributo hidden). admin-comun.js lo muestra
       solo después de comprobar que el usuario tiene permiso -->
  <div class="panel-contenedor" id="panel" hidden>

    <!-- ENLACE DE SALTO: es lo primero que recibe el foco al usar la tecla
         Tab. Lleva directo al contenido, sin recorrer el menú. Está fuera de
         la pantalla y aparece solo cuando recibe el foco (css/estilos.css) -->
    <a class="enlace-saltar" href="#contenido">Saltar al contenido</a>

    <!-- MENÚ VERTICAL. aside es la etiqueta para un bloque lateral -->
    <aside class="panel-lateral">
      <a class="panel-marca" href="index.html">AndesTrekking</a>
      <p class="panel-etiqueta">Panel de administración</p>

      <!-- Aquí JavaScript escribe el nombre y el rol del usuario -->
      <p class="panel-saludo" id="saludoPanel"></p>

      <!-- La lista parte vacía: js/admin/admin-comun.js agrega solo las
           opciones que el rol del usuario puede usar -->
      <nav aria-label="Menú del panel">
        <ul class="panel-menu" id="menuPanel"></ul>
      </nav>
    </aside>

    <!-- CONTENIDO propio de cada página del panel -->
    <main class="panel-contenido" id="contenido" tabindex="-1">
      <h1 class="panel-titulo">Órdenes</h1>

      <!-- Caja de avisos: parte oculta. Muestra los avisos que llegan por
           la URL al volver del detalle de una orden -->
      <p class="mensaje-aviso" id="avisoPanel" role="status" hidden></p>

      <!-- ordenes.js escribe aquí cuántas órdenes hay -->
      <div class="panel-barra">
        <p class="panel-barra-texto" id="resumenOrdenes"></p>
      </div>

      <!-- Pista: avisa que la tabla se puede deslizar. Parte oculta;
           admin-comun.js la muestra solo si la tabla no cabe -->
      <p class="panel-tabla-pista" hidden>
        <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
        Desliza la tabla hacia los lados para ver todas las columnas.
      </p>

      <!-- El contenedor permite desplazar la tabla hacia los lados en
           pantallas angostas, sin que se desborde la página. role y
           aria-label le dan un nombre para los lectores de pantalla.
           Cuando la tabla no cabe, admin-comun.js le agrega tabindex,
           para llegar con Tab y desplazarla con las flechas -->
      <div class="panel-tabla-contenedor" role="region"
           aria-label="Tabla de órdenes, se puede desplazar hacia los lados">
        <table class="table panel-tabla">
          <!-- caption describe la tabla para los lectores de pantalla -->
          <caption class="visually-hidden">Listado de órdenes de compra, de la más reciente a la más antigua</caption>
          <thead>
            <tr>
              <!-- scope="col" indica que cada título corresponde a su columna -->
              <th scope="col">Fecha</th>
              <th scope="col">N° Orden</th>
              <th scope="col">Cliente</th>
              <th scope="col">Estado</th>
              <th scope="col" class="celda-numero">Total</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <!-- El cuerpo parte vacío: ordenes.js agrega una fila por orden -->
          <tbody id="cuerpoTablaOrdenes"></tbody>
        </table>
      </div>

      <!-- PAGINACIÓN: ordenes.js escribe el texto ("Mostrando 1 a 5 de 20")
           y dibuja los botones Anterior, los números y Siguiente -->
      <nav class="panel-paginacion" aria-label="Páginas del listado de órdenes">
        <!-- role="status": al cambiar de página, los lectores de pantalla
             anuncian qué órdenes se están viendo -->
        <p class="panel-paginacion-texto" id="textoPaginacion" role="status"></p>
        <ul class="panel-paginacion-botones" id="botonesPaginacion"></ul>
      </nav>
    </main>

  </div>

  <!-- Scripts, siempre al final del body y en este orden:
       1. Bootstrap bundle
       2. js/data/*
       3. js/core/*
       4. Script común de la zona (js/admin/admin-comun.js)
       5. Script de la página
       El orden importa: cada archivo usa lo que definieron los anteriores. -->

  <!-- 1. Bootstrap -->
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

  <!-- 2. Datos iniciales (semillas) -->
  <script src="../js/data/productos.js"></script>
  <script src="../js/data/usuarios.js"></script>
  <script src="../js/data/ordenes.js"></script>
  <script src="../js/data/cupones.js"></script>
  <script src="../js/data/regiones.js"></script>

  <!-- 3. Lógica compartida. storage.js va después de los datos porque
       copia las semillas a localStorage apenas se carga -->
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/validaciones.js"></script>
  <script src="../js/core/auth.js"></script>

  <!-- 4. Script común del panel: protección, menú, saludo y cerrar sesión -->
  <script src="../js/admin/admin-comun.js"></script>

  <!-- 5. Script propio de esta página: tabla de órdenes y paginación -->
  <script src="../js/admin/ordenes.js"></script>
</body>
</html>
