<!DOCTYPE html>
<!--
  Archivo: plantilla.html
  Qué es: página base de la tienda AndesTrekking. No es una página del sitio:
          sirve de molde para copiar al crear cada página pública
          (index.html, productos.html, contacto.html, etc.).
  Cómo se usa: copiar el archivo, cambiar el <title>, la descripción y el
          contenido del <main>. El header y el footer se dejan iguales.
  Nota: se elimina cuando exista index.html (rama feature/catalogo).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho de la pantalla del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AndesTrekking: tienda online de trekking, senderismo y outdoor.">
  <title>Plantilla | AndesTrekking</title>

  <!-- Estilos, en este orden: Bootstrap, íconos y al final los propios,
       para que estilos.css tenga prioridad sobre Bootstrap -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- HEADER: logo, menú de navegación, carrito y enlaces de sesión -->
  <header class="encabezado">
    <!-- navbar-expand-lg: en pantallas grandes el menú se ve completo;
         en pantallas chicas se oculta y aparece el botón para abrirlo -->
    <nav class="navbar navbar-expand-lg" aria-label="Menú principal">
      <div class="container">

        <!-- Nombre de la tienda (se cambia por el logo cuando esté listo) -->
        <a class="navbar-brand encabezado-marca" href="index.html">AndesTrekking</a>

        <!-- Botón que abre y cierra el menú en el celular.
             data-bs-target apunta al id del bloque que se muestra u oculta -->
        <button class="navbar-toggler encabezado-boton-menu" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Abrir o cerrar el menú">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

          <!-- Enlaces de navegación. me-auto empuja el otro grupo a la derecha.
               En cada página, el enlace de esa página lleva además
               class="nav-link active" y aria-current="page" -->
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>

          <!-- Carrito y enlaces de sesión. Más adelante, tienda-comun.js
               actualizará el contador y cambiará los enlaces si hay sesión -->
          <ul class="navbar-nav" id="menuSesion">
            <li class="nav-item">
              <a class="nav-link" href="carrito.html">
                <i class="bi bi-cart3" aria-hidden="true"></i>
                Carrito
                <span class="carrito-contador" id="contadorCarrito">0</span>
                <span class="visually-hidden">productos</span>
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
          </ul>

        </div>
      </div>
    </nav>
  </header>

  <!-- MAIN: contenido propio de cada página -->
  <main class="container py-4">
    <!-- Contenido de ejemplo: se reemplaza al copiar la plantilla -->
    <h1>Título de la página</h1>
    <p>
      <i class="bi bi-compass" aria-hidden="true"></i>
      Texto de ejemplo con un <a href="#">enlace de prueba</a>.
    </p>
  </main>

  <!-- FOOTER: nombre, categorías, medios de pago y newsletter -->
  <footer>
  </footer>

  <!-- Scripts, siempre al final del body y en este orden:
       1. Bootstrap bundle
       2. js/data/*
       3. js/core/*
       4. Script común de la zona (js/tienda/tienda-comun.js)
       5. Script de la página
       Por ahora solo existe el primero. -->
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
